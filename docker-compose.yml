# HVWA — hardened lab stack. HVWA is DELIBERATELY VULNERABLE (see docs/SECURITY.md).
#
#   host 127.0.0.1:1337 --> proxy (nginx, unprivileged) --> app:1337 (node, non-root)
#                           networks: edge + lab            networks: lab ONLY
#
# `lab` is internal with an isolated gateway: the app has no route to the
# internet, your LAN or the Docker host. Docker cannot publish ports from an
# internal-only network, hence the thin proxy, published on loopback only.
#
#   docker compose up -d          -> http://127.0.0.1:1337 (sign in as admin / password, then change it)
#   docker compose down           (keeps the data volume; add -v to reset it)
#   npm run verify:docker         (checks every property above)
#
# Pull-only users (no checkout) use docker-compose.hub.yml instead: the same
# stack on the published image, with the proxy config inline.

# Fixed project name: containers, networks and the volume are always hvwa_*,
# whichever checkout this is run from, and never collide with other projects.
name: hvwa

services:
  app:
    build:
      context: .
      args:
        # full (default) or lite (src/editions.ts), e.g. HVWA_EDITION=lite docker compose up -d --build
        HVWA_EDITION: ${HVWA_EDITION:-full}
    image: hvwa-app:local
    init: true
    networks: [lab]
    expose: ["1337"]
    environment:
      # Optional. Blank = use the random secret persisted in the data volume.
      FLAG_SECRET: ${FLAG_SECRET:-}
      # Optional extra Host names (DNS-rebinding guard). The proxy enforces its
      # own list in docker/proxy/nginx.conf, so a name must be added there too.
      HVWA_ALLOWED_HOSTS: ${HVWA_ALLOWED_HOSTS:-}
      # The platform login is ON in the image (NODE_ENV=production). Blank = on.
      HVWA_AUTH: ${HVWA_AUTH:-}
      # Optional first password of the admin account (blank = "password").
      HVWA_ADMIN_PASSWORD: ${HVWA_ADMIN_PASSWORD:-}
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1337/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  proxy:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
    depends_on:
      app:
        condition: service_healthy
    networks: [edge, lab]
    ports:
      - "127.0.0.1:1337:8080" # loopback ONLY — never 0.0.0.0
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

networks:
  edge: {}
  lab:
    internal: true
    driver_opts:
      # `internal` alone removes the default route but still gives the HOST an
      # address (.1) on this bridge, so the app could connect to the host's
      # own services. `isolated` (Docker Engine 28+) puts no host address on it.
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  data: {}
