# docker/proxy/nginx.conf — the ONLY way into HVWA. Mounted read-only into an
# unprivileged nginx (uid 101, port 8080, read-only rootfs, cap_drop ALL).
# The proxy must stay transparent: it adds no security headers and filters no
# payloads (the labs are meant to be exploitable); it only forwards to app:1337.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    # Read-only rootfs: every path nginx writes to lives on the /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;

    # Docker's embedded DNS: re-resolve `app` so a restarted container is found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # Upload labs need room; header/cookie/JWT labs need big headers, and
        # header-name tricks (underscores, odd names) must reach the app.
        client_max_body_size 25m;
        large_client_header_buffers 4 32k;
        underscores_in_headers on;
        ignore_invalid_headers off;
        merge_slashes off;

        location / {
            # A variable upstream is resolved per request (see resolver above);
            # with no URI part the client's request URI is passed unchanged.
            set $hvwa_upstream http://app:1337;
            proxy_pass $hvwa_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_redirect off;

            # No caching anywhere: every request reaches the lab.
            proxy_cache off;
            proxy_buffering off;
        }
    }
}
