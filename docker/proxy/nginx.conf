# docker/proxy/nginx.conf — the ONLY way into HVWA. Mounted read-only into an
# unprivileged nginx (uid 101, port 8080, read-only rootfs, cap_drop ALL).
# docker-compose.hub.yml carries a verbatim copy inline (HVWA_NGINX_CONF, every
# $ doubled for compose) for pull-only users; tests/docker-files.spec.ts keeps
# the two identical, so edit this file and copy it there.
# The proxy must stay transparent: it adds no security headers and filters no
# payloads (the labs are meant to be exploitable); it only forwards to app:1337.
# One exception, the DNS-rebinding guard: only the loopback Host names are
# forwarded. Anything else is answered 421 here and never reaches the app,
# which enforces the same rule itself (src/core/host-guard.ts).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    # Read-only rootfs: every path nginx writes to lives on the /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;

    # Docker's embedded DNS: re-resolve `app` so a restarted container is found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Any Host that matches no server_name below, or no Host at all, ends up
    # here. (nginx compares $host: lowercased, port and trailing dot dropped,
    # taken from an absolute-form request line if present.)
    server {
        listen 8080 default_server;
        server_name _;
        default_type text/plain;
        return 421 "421 Misdirected Request (HVWA proxy): HVWA only answers to localhost, 127.0.0.1 and [::1]. This blocks DNS-rebinding attacks; see docs/SECURITY.md.\n";
    }

    server {
        listen 8080;
        # The loopback names a local browser sends, on any port. To allow an
        # extra name (advanced, see docs/SECURITY.md), add it here AND to
        # HVWA_ALLOWED_HOSTS.
        server_name localhost 127.0.0.1 "~^\[::1\]$";

        # Upload labs need room; header/cookie/JWT labs need big headers, and
        # header-name tricks (underscores, odd names) must reach the app.
        client_max_body_size 25m;
        large_client_header_buffers 4 32k;
        underscores_in_headers on;
        ignore_invalid_headers off;
        merge_slashes off;

        location / {
            # A variable upstream is resolved per request (see resolver above);
            # with no URI part the client's request URI is passed unchanged.
            set $hvwa_upstream http://app:1337;
            proxy_pass $hvwa_upstream;

            # Transparent: the client's Host (with its port) goes through as
            # sent, and NO X-Real-IP / X-Forwarded-* are set or appended.
            # Those headers are client input that labs read (e.g. GK-03
            # trusts X-Real-IP); rewriting them would change the labs. The
            # server block was already chosen on $host, and the app re-checks
            # Host, so a mismatched absolute-form request fails closed there.
            proxy_http_version 1.1;
            proxy_set_header Host       $http_host;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect off;

            # No caching anywhere: every request reaches the lab. Bodies are
            # streamed, not spooled to the small /tmp tmpfs (uploads up to
            # client_max_body_size).
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
