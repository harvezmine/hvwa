<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><!-- Paper fibre (app.css guild papers: cards, panels): a fine low-alpha speckle, no stains, tiled over a token colour. --><filter id="f" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.33 0 0 0 0 0.22 0 0 0 0 0.09 0.4 0 0 0 -0.16"/></filter><rect width="240" height="240" filter="url(#f)"/></svg>
