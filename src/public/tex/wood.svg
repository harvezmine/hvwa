<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256"><!-- Wood grain (app.css .wood): stretched fractal noise as dark streaks with alpha, tiled seamlessly over a token colour. --><filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.12" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.09 0 0 0 0 0.045 0 0 0 0 0.015 1.6 0 0 0 -0.56"/></filter><rect width="512" height="256" filter="url(#g)"/></svg>
